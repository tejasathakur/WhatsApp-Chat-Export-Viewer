name: whatsapp_archive_viewer
description: Standalone WhatsApp Desktop Chat Archive Viewer for Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.0.0
  desktop_drop: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0
  just_audio: ^0.10.6
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/chatwp.jpg

flutter_launcher_icons:
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.jpg"
  windows:
    generate: true
    image_path: "assets/icon.jpg"
    icon_size: 256 # Best quality for Windows desktop scaling